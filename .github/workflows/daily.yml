name: Daily dashboard update

on:
  # GitHub often starts scheduled runs hours late (worst at the top of the hour), so: odd minutes, several early
  # attempts, and the last one publishes with whatever is available. Times UTC (MDT = UTC-6, MST = UTC-7).
  schedule:
    - cron: "17 8 * * *"    # 2:17 am MDT
    - cron: "47 9 * * *"    # 3:47 am MDT
    - cron: "17 11 * * *"   # 5:17 am MDT
    - cron: "47 12 * * *"   # 6:47 am MDT  (final attempt)
  workflow_dispatch:         # "Run workflow" button for a manual update
  push:                      # a code change on main rebuilds the site right away (the bot's own daily commits don't trigger this)
    branches: [main]
    paths: ["Dashboard/**", "automation/**", "VERSION", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install numpy

      # big, unchanging inputs (last season + 2008-2024 history + the model's history cache): downloaded once, then reused
      - uses: actions/cache@v4
        with:
          path: |
            Source Data
            Dashboard/inputs/history/moneypuck
            ~/.mammoth_cache
          key: mammoth-history-v2-${{ hashFiles('Dashboard/calibration/fit_impact.py') }}

      - id: skip
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && git log -1 --format=%s | grep -q "Daily update $(date -u +%F)"; then
            echo "Already published this morning; nothing to do."; echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - id: run
        if: steps.skip.outputs.status != 'skipped'
        env:
          # Preferred: Workload Identity Federation (repository variables; no stored key). Fallback: an API key secret.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FLAG=""
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "47 12 * * *" ]; then FLAG="--final-attempt"; fi
          python automation/daily.py $FLAG

      - if: steps.run.outputs.status == 'published'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save state (box scores, lineup, brief, roster, trend history)
        if: steps.run.outputs.status == 'published'
        continue-on-error: true
        run: |
          git config user.name "mammoth-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dashboard/config Dashboard/inputs/nhl Dashboard/inputs/bio_supplement.csv Dashboard/history/snapshots.json Dashboard/history/last_run.json
          # only scheduled runs write "Daily update <date>" (the skip check looks for it); pushes and manual runs say "Rebuild"
          if [ "${{ github.event_name }}" = "schedule" ]; then MSG="Daily update $(date -u +%F)"; else MSG="Rebuild $(date -u +%F)"; fi
          git diff --cached --quiet || git commit -m "$MSG"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push

  deploy:
    needs: update
    if: needs.update.outputs.status == 'published'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
